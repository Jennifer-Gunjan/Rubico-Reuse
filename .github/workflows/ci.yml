name: CI
on:
  push:
    branches: [main] # branches are tested through their pull request, so a push is not run twice
  pull_request:
  workflow_dispatch:
# A newer push cancels the older run on a branch or PR, but never a run on main (its live tests must finish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  live-api:
    # Real Supabase project. Runs after merges to main, or by hand from the Actions tab. Needs the four secrets below.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both live jobs use the same test accounts: queue them (also across runs), never cancel one midway.
    concurrency: { group: live-accounts, cancel-in-progress: false }
    env:
      # URL and publishable key are public (they ship in the website), so a missing secret falls back to them.
      LIVE_SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL || 'https://mdznlxohnjfbybihbtfe.supabase.co' }}
      LIVE_SUPABASE_ANON_KEY: ${{ secrets.LIVE_SUPABASE_ANON_KEY || 'sb_publishable_Ewt_4WTCXYOsfIn6IUydMg_tefg8Xjp' }}
      LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
      LIVE_TEST_PASSWORD: ${{ secrets.LIVE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fail if secrets are missing (otherwise the tests would silently skip)
        run: |
          missing=""
          for v in LIVE_SUPABASE_URL LIVE_SUPABASE_ANON_KEY LIVE_TEST_EMAIL LIVE_TEST_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "Missing:$missing"; exit 1; }
      - run: npx vitest run tests/live
  races:
    # Real Postgres service: two simultaneous accepts must give exactly one winner. No secrets needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/concurrency
  e2e-anonymous:
    # Browser tests that need no accounts: login page, domain message, protected pages, closed cron route.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
  e2e-journey:
    # Two real accounts: post, request, accept, handover, against the live Supabase project. Needs the LIVE_TEST_*_2 secrets.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both live jobs use the same test accounts: queue them (also across runs), never cancel one midway.
    concurrency: { group: live-accounts, cancel-in-progress: false }
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL || 'https://mdznlxohnjfbybihbtfe.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LIVE_SUPABASE_ANON_KEY || 'sb_publishable_Ewt_4WTCXYOsfIn6IUydMg_tefg8Xjp' }}
      E2E_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
      E2E_PASSWORD: ${{ secrets.LIVE_TEST_PASSWORD }}
      E2E_EMAIL_2: ${{ secrets.LIVE_TEST_EMAIL_2 }}
      E2E_PASSWORD_2: ${{ secrets.LIVE_TEST_PASSWORD_2 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Fail if secrets are missing (otherwise the journey would silently skip)
        run: |
          missing=""
          for v in E2E_EMAIL E2E_PASSWORD E2E_EMAIL_2 E2E_PASSWORD_2; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "Missing (set LIVE_TEST_EMAIL, LIVE_TEST_PASSWORD, LIVE_TEST_EMAIL_2, LIVE_TEST_PASSWORD_2):$missing"; exit 1; }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Journey
        run: npx playwright test journey
      - name: Accessibility, signed in
        if: always()
        run: npx playwright test a11y-app
